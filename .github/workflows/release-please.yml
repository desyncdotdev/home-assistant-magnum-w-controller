name: Release

# release-please keeps a pull request open with the next version, from the Conventional Commits
# titles on main since the last release, and its changelog. Merging it tags the release, and the
# zip HACS downloads (hacs.json) is then added to it.
on:
  push:
    branches:
      - main

permissions: {}

# One run at a time, so a release is created and gets its zip before the next push is looked at.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  zip:
    name: Add the zip to the release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build the zip
        run: |
          cd custom_components/magnum_w_controller
          zip -r "${GITHUB_WORKSPACE}/magnum_w_controller.zip" . -x "__pycache__/*"

      - name: Upload the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" magnum_w_controller.zip --repo "${GITHUB_REPOSITORY}"
