name: Conventional Commits

# release-please builds the changelog and the version from the commit titles on main. A pull
# request is squashed into one commit titled after the pull request, or after its commit if it
# has only one: both must follow Conventional Commits, with one of the types that are changelog
# sections in release-please-config.json. Checked again when the title is edited.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

# A newer push or title edit of the same pull request replaces the run for the one before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titles:
    name: Titles
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            deps
            docs
            test
            build
            ci
            style
            chore
          validateSingleCommit: true
